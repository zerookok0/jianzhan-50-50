# ============================================================================
# WRANGLER CONFIG — local development
# ----------------------------------------------------------------------------
# This file makes `npm run worker:dev` (and the D1 migration commands) run the
# real Worker runtime locally against a local SQLite file in .wrangler/state.
#
# The database_id below is a LOCAL placeholder. It is never contacted: with
# `--local` / `wrangler dev` the binding resolves to a SQLite file on disk, and
# no request leaves this machine. Replace it with the id printed by
# `npx wrangler d1 create jianzhan-db` before deploying.
#
# SECRETS ARE NOT HERE. They live in .dev.vars (git-ignored) locally, and in
# `wrangler secret put` in the cloud. Anything under [vars] is public.
# ============================================================================

name = "jianzhan-api"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "jianzhan-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "jianzhan-images"

[vars]
ENVIRONMENT = "development"
APP_ORIGIN = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
DEFAULT_CURRENCY = "USD"
ORDER_RESERVATION_MINUTES = "30"
CART_TTL_DAYS = "30"

[dev]
port = 8787
local_protocol = "http"
